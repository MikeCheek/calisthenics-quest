# Daily training reminders as push notifications.
#
# Calls the app once an hour; the app reminds each athlete at their own
# local reminder time, once a day, if they haven't trained (see
# src/app/api/push/reminders/route.ts). Free on GitHub Actions; Vercel's
# free plan only runs scheduled jobs once a day, hence this.
#
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   APP_URL      e.g. https://your-app.vercel.app   (no trailing slash)
#   CRON_SECRET  the same value as the CRON_SECRET env var on Vercel
# Without them it does nothing. Scheduled workflows run from the default
# branch, and GitHub pauses them after 60 days without repository activity.
name: Training reminders

on:
  schedule:
    - cron: "7 * * * *" # every hour, a few minutes past
  workflow_dispatch: {}

permissions: {}

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send the reminders that are due
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "APP_URL or CRON_SECRET isn't set — nothing to do."
            exit 0
          fi
          curl --fail-with-body -sS -X POST -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/push/reminders"
